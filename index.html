<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Se ha eliminado la etiqueta de Cache-Control que impedía el almacenamiento -->
  <title>PS5-Relapse</title>
  <style>
    html, body {
      background: #060606;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="console"></div>
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
  
  <!-- Código agregado para registrar el caché offline -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(registration) {
          console.log('Caché offline registrado exitosamente.');
        }).catch(function(error) {
          console.error('Error al registrar el caché offline:', error);
        });
      });
    }
  </script>
</body>
</html>
