<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>PS5-Relapse</title>
  <style>
    html, body {
      background: #060606;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="console"></div>
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>

  <div class="card">
        <h1>¡Esta página está guardada!</h1>
        <p>Si apagas tu internet y recargas la página, seguirá funcionando.</p>
  </div>

  <script>
        // Este código le dice al navegador que guarde la página
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker registrado con éxito.'))
                .catch(err => console.log('Error al registrar:', err));
        }
  </script>
</body>
</html>
